spring.application.name=challenger

server.port=8082

spring.datasource.url=jdbc:h2:mem:challenger;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.h2.console.enabled=true

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.retries=0
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

app.kafka.enabled=true
app.kafka.topic-analise-cliente-mg=analise_cliente_mg
app.kafka.send-timeout-seconds=5

app.security.enabled=true
app.security.jwt.secret=${JWT_SECRET:chave-local-dev-altere-em-producao-min-32b!!}
app.security.jwt.expiration-seconds=3600
app.security.users.admin.username=${ADMIN_USERNAME:admin}
app.security.users.admin.password=${ADMIN_PASSWORD:admin123}
app.security.users.cliente.username=${CLIENTE_USERNAME:cliente}
app.security.users.cliente.password=${CLIENTE_PASSWORD:cliente123}
